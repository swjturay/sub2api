map $http_upgrade $insights_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    client_max_body_size 256m;
    location = /insights { return 308 /insights/$is_args$args; }
    location ^~ /insights/ {
        proxy_pass http://insights:80;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://sub2api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $insights_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
