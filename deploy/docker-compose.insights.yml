# Overlay the existing deployment; PostgreSQL/Redis and authentication remain
# owned by Sub2API. Run from the repository root (see docs/INSIGHTS_OPERATIONS.md).
services:
  sub2api:
    image: ${SUB2API_INSIGHTS_BACKEND_IMAGE:-sub2api:insights-local}
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      INSIGHTS_TRUSTED_COLLECTION: ${INSIGHTS_TRUSTED_COLLECTION:-false}
      INSIGHTS_STATISTICS_START_DATE: ${INSIGHTS_STATISTICS_START_DATE:-}
      DASHBOARD_AGGREGATION_RETENTION_USAGE_LOGS_DAYS: "365"
      DASHBOARD_AGGREGATION_RETENTION_USAGE_BILLING_DEDUP_DAYS: "365"
      DASHBOARD_AGGREGATION_RETENTION_HOURLY_DAYS: "365"

  insights:
    image: ${SUB2API_INSIGHTS_UI_IMAGE:-sub2api-insights:local}
    build:
      context: ../insights
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  insights-edge:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - sub2api
      - insights
    ports:
      - "${INSIGHTS_BIND_HOST:-127.0.0.1}:${INSIGHTS_EDGE_PORT:-8081}:80"
    volumes:
      - ./insights-edge.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true
