name: CCE SSE to WS validation image

on:
  push:
    branches:
      - codex/cce-sub2api-v183-sse-ws
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 validation image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/swjturay/sub2api:cce-v183-sse-ws-${{ github.sha }}
          build-args: |
            VERSION=v0.1.183-sse-ws
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=cce-v183-sse-ws-amd64
          cache-to: type=gha,mode=max,scope=cce-v183-sse-ws-amd64

      - name: Summarize immutable source
        run: |
          echo "source_sha=${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "image=ghcr.io/swjturay/sub2api:cce-v183-sse-ws-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
