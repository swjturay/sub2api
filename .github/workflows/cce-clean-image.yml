name: CCE clean branch images

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch or commit to build
        required: true
        type: string
      source_sha:
        description: Full source commit SHA
        required: true
        type: string
      version:
        description: Runtime version embedded in the images
        required: true
        type: string
        default: 0.2.5-clean-codex

permissions:
  contents: read
  packages: write

jobs:
  validate-source:
    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate dispatch inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'source_sha must be a full lowercase 40-character commit SHA' >&2
            exit 1
          }
          [[ "$SOURCE_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]] || {
            echo 'source_ref contains unsupported characters' >&2
            exit 1
          }
          [[ "$SOURCE_REF" != *'..'* && "$SOURCE_REF" != *'//'* && "$SOURCE_REF" != */ && "$SOURCE_REF" != *'.lock' ]] || {
            echo 'source_ref is not a safe Git ref or commit name' >&2
            exit 1
          }
          [[ "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$ ]] || {
            echo 'version must be a safe image-tag component of at most 64 characters' >&2
            exit 1
          }

  build-amd64:
    needs: validate-source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            repository: sub2api
            acr_tag_prefix: backend-
            context: .
            dockerfile: ./Dockerfile
            cache_scope: cce-clean-backend-amd64
          - component: insights
            repository: sub2api-insights
            acr_tag_prefix: insights-
            context: ./insights
            dockerfile: ./insights/Dockerfile
            cache_scope: cce-clean-insights-amd64
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERSION: ${{ inputs.version }}
      IMAGE: ghcr.io/swjturay/${{ matrix.repository }}:${{ inputs.version }}-${{ inputs.source_sha }}
      ACR_IMAGE: registry.cn-shanghai.aliyuncs.com/rayless/sub2api:${{ matrix.acr_tag_prefix }}${{ inputs.version }}-${{ inputs.source_sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Verify exact source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$SOURCE_SHA"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git fetch --no-tags --depth=1 origin "$SOURCE_REF"
          ref_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
          test "$ref_sha" = "$SOURCE_SHA" || {
            echo "source_ref resolves to $ref_sha, not requested source_sha $SOURCE_SHA" >&2
            exit 1
          }
          build_date="$(git show -s --format=%cI "$SOURCE_SHA")"
          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"
          {
            echo "component=${{ matrix.component }}"
            echo "source_ref=$SOURCE_REF"
            echo "source_sha=$SOURCE_SHA"
            echo "image=$IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Stage verified Windows portable Python
        if: matrix.component == 'backend'
        shell: bash
        run: |
          set -euo pipefail
          asset='python-3.13.15-embed-amd64.zip'
          checksum='d1f04d990aee1253d8569e8e5104e30fa9f5fa830899f14843448872d936a2cf'
          destination="frontend/public/scripts/$asset"
          curl --fail --location --show-error --silent \
            --connect-timeout 15 --max-time 300 --retry 5 --retry-all-errors \
            --output "$destination.part" \
            "https://www.python.org/ftp/python/3.13.15/$asset"
          echo "$checksum  $destination.part" | sha256sum --check
          mv "$destination.part" "$destination"
          echo "windows_python_asset=$asset" >> "$GITHUB_STEP_SUMMARY"
          echo "windows_python_sha256=$checksum" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}
            ${{ env.ACR_IMAGE }}
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ inputs.source_sha }}
            DATE=${{ steps.source.outputs.build_date }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.source=https://github.com/swjturay/sub2api
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Export immutable image archive and transfer manifest
        id: export
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/$COMPONENT"
          archive_name="${REPOSITORY}-${VERSION}-${SOURCE_SHA}-linux-amd64.tar.gz"
          archive="$output_dir/$archive_name"
          mkdir -p "$output_dir"

          docker pull --platform linux/amd64 "$IMAGE"
          image_digest="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' | sed 's/^[^@]*@//')"
          test -n "$image_digest"
          immutable_image="ghcr.io/swjturay/${REPOSITORY}@${image_digest}"
          docker pull --platform linux/amd64 "$immutable_image"
          docker tag "$immutable_image" "$IMAGE"

          ghcr_manifest="$RUNNER_TEMP/${COMPONENT}-ghcr-manifest.json"
          acr_manifest="$RUNNER_TEMP/${COMPONENT}-acr-manifest.json"
          docker buildx imagetools inspect "$IMAGE" --raw > "$ghcr_manifest"
          docker buildx imagetools inspect "$ACR_IMAGE" --raw > "$acr_manifest"
          ghcr_digest="sha256:$(sha256sum "$ghcr_manifest" | cut -d' ' -f1)"
          acr_digest="sha256:$(sha256sum "$acr_manifest" | cut -d' ' -f1)"
          test "$ghcr_digest" = "$image_digest"
          test "$acr_digest" = "$image_digest"
          acr_immutable_image="${ACR_IMAGE%%:*}@${acr_digest}"

          docker save "$IMAGE" | gzip -1 > "$archive"
          archive_sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          printf '%s  %s\n' "$archive_sha256" "$archive_name" > "$archive.sha256"

          jq -n \
            --arg schema_version '1' \
            --arg component "$COMPONENT" \
            --arg image "$IMAGE" \
            --arg immutable_image "$immutable_image" \
            --arg acr_image "$ACR_IMAGE" \
            --arg acr_immutable_image "$acr_immutable_image" \
            --arg acr_digest "$acr_digest" \
            --arg digest "$image_digest" \
            --arg platform 'linux/amd64' \
            --arg source_repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --arg source_ref "$SOURCE_REF" \
            --arg source_sha "$SOURCE_SHA" \
            --arg version "$VERSION" \
            --arg archive "$archive_name" \
            --arg archive_sha256 "$archive_sha256" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{
              schema_version: $schema_version,
              component: $component,
              image: $image,
              immutable_image: $immutable_image,
              acr_image: $acr_image,
              acr_immutable_image: $acr_immutable_image,
              acr_digest: $acr_digest,
              digest: $digest,
              platform: $platform,
              source_repository: $source_repository,
              source_ref: $source_ref,
              source_sha: $source_sha,
              version: $version,
              archive: $archive,
              archive_sha256: $archive_sha256,
              run_url: $run_url
            }' > "$output_dir/manifest.json"

          {
            echo "image_digest=$image_digest"
            echo "acr_image=$acr_immutable_image"
            echo "archive=$archive_name"
            echo "archive_sha256=$archive_sha256"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"

      - name: Upload immutable image transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.repository }}-${{ inputs.version }}-${{ inputs.source_sha }}-linux-amd64
          path: ${{ steps.export.outputs.output_dir }}
          if-no-files-found: error
          retention-days: 14
