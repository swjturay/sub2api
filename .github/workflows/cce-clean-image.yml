name: CCE clean branch image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch or commit to build
        required: true
        type: string
      source_sha:
        description: Full source commit SHA
        required: true
        type: string
      version:
        description: Runtime version embedded in the image
        required: true
        type: string
        default: 0.2.1-clean-codex

permissions:
  contents: read
  packages: write

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Verify exact source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
          echo "source_ref=${{ inputs.source_ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "source_sha=${{ inputs.source_sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/swjturay/sub2api:${{ inputs.version }}-${{ inputs.source_sha }}
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ inputs.source_sha }}
            DATE=${{ github.run_started_at }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.source=https://github.com/swjturay/sub2api
          cache-from: type=gha,scope=cce-clean-amd64
          cache-to: type=gha,mode=max,scope=cce-clean-amd64

      - name: Export immutable image archive
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/swjturay/sub2api:${{ inputs.version }}-${{ inputs.source_sha }}"
          docker pull --platform linux/amd64 "$image"
          digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          archive="$RUNNER_TEMP/sub2api-${{ inputs.version }}-amd64.tar.gz"
          docker save "$image" | gzip -1 > "$archive"
          sha256sum "$archive" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "image_digest=$digest" >> "$GITHUB_STEP_SUMMARY"
          echo "archive=$(basename "$archive")" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable image archive
        uses: actions/upload-artifact@v4
        with:
          name: sub2api-${{ inputs.version }}-${{ inputs.source_sha }}-amd64
          path: ${{ runner.temp }}/sub2api-${{ inputs.version }}-amd64.tar.gz
          if-no-files-found: error
          retention-days: 14
