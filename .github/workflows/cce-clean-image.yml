name: CCE ACR release archive

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch, tag, or commit to build
        required: true
        type: string
      source_sha:
        description: Full source commit SHA
        required: true
        type: string
      version:
        description: Runtime version embedded in the images
        required: true
        type: string
        default: 0.2.8
  push:
    tags:
      - 'cce-v*'

permissions:
  actions: read
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.inputs.outputs.source_ref }}
      source_sha: ${{ steps.inputs.outputs.source_sha }}
      version: ${{ steps.inputs.outputs.version }}
    steps:
      - name: Resolve and validate release inputs
        id: inputs
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.source_ref }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            source_ref="$GITHUB_REF_NAME"
            source_sha="$GITHUB_SHA"
            version="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^cce-v//')"
          else
            source_ref="$REQUESTED_REF"
            source_sha="$REQUESTED_SHA"
            version="$REQUESTED_VERSION"
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'source_sha must be a full lowercase 40-character commit SHA' >&2
            exit 1
          }
          [[ "$source_ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]] || {
            echo 'source_ref contains unsupported characters' >&2
            exit 1
          }
          [[ "$source_ref" != *'..'* && "$source_ref" != *'//'* && "$source_ref" != */ && "$source_ref" != *'.lock' ]] || {
            echo 'source_ref is not a safe Git ref or commit name' >&2
            exit 1
          }
          [[ "$version" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$ ]] || {
            echo 'version must be a safe image-tag component of at most 64 characters' >&2
            exit 1
          }
          {
            echo "source_ref=$source_ref"
            echo "source_sha=$source_sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.inputs.outputs.source_sha }}
          fetch-depth: 1

      - name: Verify source ref resolves to the requested commit
        shell: bash
        env:
          SOURCE_REF: ${{ steps.inputs.outputs.source_ref }}
          SOURCE_SHA: ${{ steps.inputs.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags --depth=1 origin "$SOURCE_REF"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE_SHA"

  verify-ci:
    needs: validate-source
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_SHA: ${{ needs.validate-source.outputs.source_sha }}
    steps:
      - name: Require successful source CI
        shell: bash
        run: |
          set -euo pipefail
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&per_page=100"
          for attempt in $(seq 1 30); do
            runs="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api")"
            ci="$(jq -r '[.workflow_runs[] | select(.name == "CI")] | sort_by(.run_number) | last | .conclusion // "missing"' <<<"$runs")"
            security="$(jq -r '[.workflow_runs[] | select(.name == "Security Scan")] | sort_by(.run_number) | last | .conclusion // "missing"' <<<"$runs")"
            insights="$(jq -r '[.workflow_runs[] | select(.name == "Insights CI")] | sort_by(.run_number) | last | if . == null then "not_applicable" elif .status != "completed" then .status else .conclusion end' <<<"$runs")"
            if [[ "$ci" == success && "$security" == success && ( "$insights" == success || "$insights" == not_applicable ) ]]; then
              printf 'CI gates passed: CI=%s Security=%s Insights=%s\n' "$ci" "$security" "$insights"
              exit 0
            fi
            if [[ "$ci" =~ ^(failure|cancelled|timed_out|action_required)$ || "$security" =~ ^(failure|cancelled|timed_out|action_required)$ || "$insights" =~ ^(failure|cancelled|timed_out|action_required)$ ]]; then
              printf 'CI gate failed: CI=%s Security=%s Insights=%s\n' "$ci" "$security" "$insights" >&2
              exit 1
            fi
            printf 'Waiting for CI gates (%s/30): CI=%s Security=%s Insights=%s\n' "$attempt" "$ci" "$security" "$insights"
            sleep 10
          done
          echo 'timed out waiting for source CI gates' >&2
          exit 1

  build-amd64:
    needs:
      - validate-source
      - verify-ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            acr_tag_prefix: backend-
            context: .
            dockerfile: ./Dockerfile
            cache_scope: cce-backend-amd64
          - component: insights
            acr_tag_prefix: insights-
            context: ./insights
            dockerfile: ./insights/Dockerfile
            cache_scope: cce-insights-amd64
    env:
      SOURCE_REF: ${{ needs.validate-source.outputs.source_ref }}
      SOURCE_SHA: ${{ needs.validate-source.outputs.source_sha }}
      VERSION: ${{ needs.validate-source.outputs.version }}
      ACR_IMAGE: registry.cn-shanghai.aliyuncs.com/rayless/sub2api:${{ matrix.acr_tag_prefix }}${{ needs.validate-source.outputs.version }}-${{ needs.validate-source.outputs.source_sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Read reproducible build date
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          build_date="$(git show -s --format=%cI "$SOURCE_SHA")"
          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Stage verified Windows portable Python
        if: matrix.component == 'backend'
        shell: bash
        run: |
          set -euo pipefail
          asset='python-3.13.15-embed-amd64.zip'
          checksum='d1f04d990aee1253d8569e8e5104e30fa9f5fa830899f14843448872d936a2cf'
          destination="frontend/public/scripts/$asset"
          curl --fail --location --show-error --silent \
            --connect-timeout 15 --max-time 300 --retry 5 --retry-all-errors \
            --output "$destination.part" \
            "https://www.python.org/ftp/python/3.13.15/$asset"
          echo "$checksum  $destination.part" | sha256sum --check
          mv "$destination.part" "$destination"

      - name: Build and push linux/amd64 image to ACR
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.ACR_IMAGE }}
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.SOURCE_SHA }}
            DATE=${{ steps.source.outputs.build_date }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Verify ACR digest and write component manifest
        id: manifest
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          raw_manifest="$RUNNER_TEMP/$COMPONENT-raw-manifest.json"
          docker buildx imagetools inspect "$ACR_IMAGE" --raw > "$raw_manifest"
          test "sha256:$(sha256sum "$raw_manifest" | cut -d' ' -f1)" = "$DIGEST"
          repository="$(printf '%s' "$ACR_IMAGE" | sed 's/:[^:]*$//')"
          immutable_image="$repository@$DIGEST"
          output_dir="$RUNNER_TEMP/cce-manifests"
          mkdir -p "$output_dir"
          jq -n \
            --arg component "$COMPONENT" \
            --arg tagged_image "$ACR_IMAGE" \
            --arg immutable_image "$immutable_image" \
            --arg digest "$DIGEST" \
            --arg platform 'linux/amd64' \
            --arg source_sha "$SOURCE_SHA" \
            '{
              component: $component,
              tagged_image: $tagged_image,
              immutable_image: $immutable_image,
              digest: $digest,
              platform: $platform,
              source_sha: $source_sha
            }' > "$output_dir/$COMPONENT.json"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"
          {
            echo "component=$COMPONENT"
            echo "acr_image=$immutable_image"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload component release metadata
        uses: actions/upload-artifact@v4
        with:
          name: cce-${{ matrix.component }}-manifest-${{ env.SOURCE_SHA }}
          path: ${{ steps.manifest.outputs.output_dir }}/${{ matrix.component }}.json
          if-no-files-found: error
          retention-days: 90

  assemble-release-manifest:
    needs:
      - validate-source
      - build-amd64
    runs-on: ubuntu-latest
    env:
      SOURCE_REF: ${{ needs.validate-source.outputs.source_ref }}
      SOURCE_SHA: ${{ needs.validate-source.outputs.source_sha }}
      VERSION: ${{ needs.validate-source.outputs.version }}
    steps:
      - name: Download component metadata
        uses: actions/download-artifact@v4
        with:
          pattern: cce-*-manifest-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/components
          merge-multiple: true

      - name: Assemble immutable CCE release manifest
        id: release
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/components/backend.json"
          test -f "$RUNNER_TEMP/components/insights.json"
          output_dir="$RUNNER_TEMP/release"
          mkdir -p "$output_dir"
          manifest="$output_dir/cce-release-manifest.json"
          jq -n \
            --arg schema_version '2' \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg source_repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --arg source_ref "$SOURCE_REF" \
            --arg source_sha "$SOURCE_SHA" \
            --arg version "$VERSION" \
            --arg build_run_id "$GITHUB_RUN_ID" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --slurpfile backend "$RUNNER_TEMP/components/backend.json" \
            --slurpfile insights "$RUNNER_TEMP/components/insights.json" \
            '{
              schema_version: $schema_version,
              created_at: $created_at,
              source_repository: $source_repository,
              source_ref: $source_ref,
              source_sha: $source_sha,
              version: $version,
              build_run_id: $build_run_id,
              run_url: $run_url,
              images: {
                backend: $backend[0],
                insights: $insights[0]
              }
            }' > "$manifest"
          sha256sum "$manifest" > "$manifest.sha256"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"
          {
            echo "release_manifest=cce-release-manifest.json"
            echo "source_sha=$SOURCE_SHA"
            echo "version=$VERSION"
            echo "deployment=independent ops-host flow"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete CCE release manifest
        uses: actions/upload-artifact@v4
        with:
          name: cce-release-${{ env.VERSION }}-${{ env.SOURCE_SHA }}
          path: ${{ steps.release.outputs.output_dir }}
          if-no-files-found: error
          retention-days: 90
