name: CCE clean branch image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch to build
        required: true
        type: string
      source_sha:
        description: Full source commit SHA
        required: true
        type: string
      version:
        description: Runtime version embedded in the image
        required: true
        default: 0.2.0-clean
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact clean source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Verify exact source commit
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
          echo "source_ref=${{ inputs.source_ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "source_sha=${{ inputs.source_sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/swjturay/sub2api:cce-v0.2.0-clean-${{ inputs.source_sha }}
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ inputs.source_sha }}
            DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=cce-v0.2.0-clean-amd64
          cache-to: type=gha,mode=max,scope=cce-v0.2.0-clean-amd64

      - name: Export immutable image archive
        run: |
          image="ghcr.io/swjturay/sub2api:cce-v0.2.0-clean-${{ inputs.source_sha }}"
          docker pull --platform linux/amd64 "$image"
          docker image inspect "$image" --format '{{.Os}}/{{.Architecture}} {{index .RepoDigests 0}}'
          docker save "$image" | gzip -1 > /tmp/sub2api-cce-v0.2.0-clean.tar.gz
          sha256sum /tmp/sub2api-cce-v0.2.0-clean.tar.gz >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable image archive
        uses: actions/upload-artifact@v4
        with:
          name: sub2api-cce-v0.2.0-clean-${{ inputs.source_sha }}
          path: /tmp/sub2api-cce-v0.2.0-clean.tar.gz
          if-no-files-found: error
          retention-days: 7
