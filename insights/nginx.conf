server {
  listen 80;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
  location /insights/assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /insights/ { try_files $uri $uri/ /insights/index.html; }
}
